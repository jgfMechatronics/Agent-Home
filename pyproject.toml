[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-home"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "pydantic-ai>=2.54.0",
    "python-dotenv",
    "asgi-lifespan>=2.1.0",
    "httpx",
    # DuckDuckGo search + web_fetch tools for pydantic-ai. These are the underlying
    # deps for pydantic-ai-slim[duckduckgo] and [web-fetch] extras. We use full
    # pydantic-ai (not slim), which doesn't expose those extras — direct deps work.
    # TODO: Consider switching to pydantic-ai-slim as a leaning operation later.
    "ddgs>=9.14.4",
    "markdownify>=1.2.3",
    "fastmcp>=3.4.3",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-xdist",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/agent",
    "src/api",
    "src/common",
    "src/db",
    "src/memory",
    "src/messages",
    "src/mcp_tools",
    "src/prototype",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", ".", "tests"]
markers = [
    "note: important info/caveats about tests",
    "e2e: end-to-end tests requiring live server",
]
addopts = "-n auto -m 'not e2e' --ignore=tests/e2e"

[tool.uv]
package = true

[tool.pyright]
extraPaths = ["src", "."]
